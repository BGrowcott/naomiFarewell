<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Fare thee well Naomi</title>
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
			rel="stylesheet"
			integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
			crossorigin="anonymous"
		/>
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
		<link rel="stylesheet" type="text/css" href="index.css" />
	</head>
	<body style="background-color: #e88141;">
		<main class="container bg-light border border-black border-5 border-top-0 border-bottom-0">
			<div class="text-center">
				<h1>Farewell Naomi</h1>

				<div>We are gonna miss ya!</div>
			</div>

			<div class="d-flex justify-content-center align-items-center" style="min-height: 80vh">
				<div class="orbit-container mt-5 d-flex justify-content-center">
					<img src="images/NaomiWinchurch.jpg" class="rounded-circle center-image position-absolute" />

					<div class="d-flex flex-wrap orbit-item-container">
						<div class="w-50 d-flex">
							<img src="images/BenGrowcott.jpg" class="rounded-circle orbit-item i1" />
						</div>
						<div class="w-50 d-flex justify-content-end">
							<img src="images/DanWood.jpg" class="rounded-circle orbit-item i2" />
						</div>

						<div class="w-50 d-flex align-items-end">
							<img src="images/EvieIngold.jpg" class="rounded-circle orbit-item i3" />
						</div>
						<div class="w-50 d-flex align-items-end justify-content-end">
							<img src="images/ShoaibIqbal.jpg" class="rounded-circle orbit-item i4" />
						</div>
					</div>
				</div>
			</div>

		</main>

		<script
			src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
			integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
			crossorigin="anonymous"
		></script>
		<script
			src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"
			integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy"
			crossorigin="anonymous"
		></script>
		<script src="index.js"></script>
	</body>
</html>
